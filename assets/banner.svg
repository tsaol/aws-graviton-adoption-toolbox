<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/>
      <stop offset="0.55" stop-color="#16263d"/>
      <stop offset="1" stop-color="#0b3b4a"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9900"/>
      <stop offset="1" stop-color="#ffb84d"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="18" fill="url(#grid)"/>
  <circle cx="1130" cy="70" r="160" fill="#ff9900" opacity="0.06"/>
  <circle cx="1210" cy="300" r="110" fill="#2dd4bf" opacity="0.06"/>

  <text x="64" y="74" fill="#ff9900" font-size="17" font-weight="700" letter-spacing="3">AI AGENT SKILLS · AWS GRAVITON</text>
  <text x="62" y="128" fill="#ffffff" font-size="46" font-weight="800">AWS Graviton Adoption Toolbox</text>
  <text x="64" y="166" fill="#cbd5e1" font-size="21">Skills that teach your coding agent to land a new</text>
  <text x="64" y="194" fill="#cbd5e1" font-size="21">workload on Graviton <tspan fill="url(#orange)" font-weight="800">and keep it there</tspan>.</text>

  <!-- agent card -->
  <g transform="translate(846,34)" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13">
    <rect width="372" height="172" rx="12" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="5" fill="#f87171"/><circle cx="38" cy="18" r="5" fill="#fbbf24"/><circle cx="56" cy="18" r="5" fill="#34d399"/>
    <text x="78" y="22" fill="#64748b" font-size="11.5">coding agent, e.g. Claude Code</text>
    <text x="18" y="50" fill="#e2e8f0">&gt; Can't launch m8g at night. Pause?</text>
    <circle cx="23" cy="72" r="4" fill="#ffb84d"/><text x="34" y="76" fill="#ffb84d">Skill  graviton-rollout-capacity</text>
    <text x="18" y="100" fill="#94a3b8">$ classify.py events.jsonl.gz --cur …</text>
    <text x="34" y="122" fill="#94a3b8">3,754 rows -&gt; 1,161 requests</text>
    <path d="M18 143 l4 4 l8 -9" fill="none" stroke="#5eead4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="148" fill="#5eead4">4 causes, owners, don't pause</text>
  </g>

  <!-- journey -->
  <g font-size="14" font-weight="600" text-anchor="middle">
    <line x1="120" y1="276" x2="1160" y2="276" stroke="#334155" stroke-width="3"/>
    <line x1="812" y1="276" x2="1160" y2="276" stroke="url(#orange)" stroke-width="4" filter="url(#glow)"/>

    <g transform="translate(120,276)"><circle r="11" fill="#1e293b" stroke="#64748b" stroke-width="3"/><text y="-24" fill="#94a3b8">Find workload</text><text y="38" fill="#64748b" font-size="12" font-weight="400">integrated</text></g>
    <g transform="translate(293,276)"><circle r="11" fill="#1e293b" stroke="#64748b" stroke-width="3"/><text y="-24" fill="#94a3b8">Benefit &amp; capacity</text><text y="38" fill="#64748b" font-size="12" font-weight="400">integrated</text></g>
    <g transform="translate(466,276)"><circle r="11" fill="#1e293b" stroke="#64748b" stroke-width="3"/><text y="-24" fill="#94a3b8">Dependency scan</text><text y="38" fill="#64748b" font-size="12" font-weight="400">Arm MCP · Kiro</text></g>
    <g transform="translate(639,276)"><circle r="11" fill="#1e293b" stroke="#64748b" stroke-width="3"/><text y="-24" fill="#94a3b8">Load test &amp; canary</text><text y="38" fill="#64748b" font-size="12" font-weight="400">checklists</text></g>
    <g transform="translate(812,276)"><circle r="13" fill="#ff9900" filter="url(#glow)"/><text y="-24" fill="#ffffff">Scale-out rollout</text><text y="38" fill="#ffb84d" font-size="12">capacity skill</text></g>
    <g transform="translate(985,276)"><circle r="13" fill="#ff9900" filter="url(#glow)"/><text y="-24" fill="#ffffff">Arm-only triage</text><text y="38" fill="#ffb84d" font-size="12">triage + repro harness</text></g>
    <g transform="translate(1158,276)"><circle r="13" fill="#2dd4bf" filter="url(#glow)"/><text y="-24" fill="#ffffff">Default to Arm</text><text y="38" fill="#5eead4" font-size="12">weekly health</text></g>
  </g>
  <text x="1216" y="342" fill="#64748b" font-size="12" text-anchor="end">scored by a replay benchmark of real incidents</text>
</svg>
